plugins { id 'com.android.application' }

android {
    namespace 'com.readinglog.storytel'
    compileSdk 35
    defaultConfig {
        applicationId 'com.readinglog.storytel'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.includeAndroidResources = true }
    buildTypes {
        release {
            // Installable prototype signing; release variant keeps android:debuggable=false.
            // Configure a durable private signing identity before a production distribution.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
